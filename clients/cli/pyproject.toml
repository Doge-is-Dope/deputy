[project]
name = "computer-use-cli"
version = "0.1.0"
description = "The command line for a computer-use runtime, over its HTTP API"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
computer-use = "computer_use_cli.main:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
