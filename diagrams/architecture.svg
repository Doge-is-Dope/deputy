<rect class="group" x="220" y="125" width="690" height="260" rx="8"/>
<text class="title" x="896" y="147" text-anchor="end">Host machine</text>
<rect class="node" x="330" y="160" width="280" height="190" rx="6"/>
<text class="name" x="470.0" y="255.0">Runtime</text>
<rect class="isolated" x="700" y="173" width="180" height="44" rx="8"/>
<text class="title" x="790.0" y="195.0" text-anchor="middle" dominant-baseline="central">Database</text>
<rect class="isolated" x="700" y="233" width="180" height="44" rx="8"/>
