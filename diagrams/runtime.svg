<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 740" width="980" height="740" role="img" aria-label="Runtime: the web UI and the CLI both reach it through sign-in, which names the user, in front of the API server, whose agents call the model APIs; the runtime keeps each user's runs in the run store, which the API server and the agents read and search, operates the Windows VM through the computer and runs code in the sandbox through the code runner">
<style>
  svg { --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --line: #59636e; --node: #f6f8fa; --group: #f6f8fa80; --border: #d1d9e0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif }
  @media (prefers-color-scheme: dark) {
    svg { --bg: #0d1117; --fg: #f0f6fc; --muted: #9198a1; --line: #9198a1; --node: #151b23; --group: #151b2380; --border: #3d444d }
  }
  .bg { fill: var(--bg) }
  .group { fill: var(--group); stroke: var(--border) }
  .isolated { fill: none; stroke: var(--muted); stroke-dasharray: 5 4 }
  .node { fill: var(--node); stroke: var(--border) }
  .name { fill: var(--fg); font-size: 14px; text-anchor: middle; dominant-baseline: central }
  .title { fill: var(--muted); font-size: 13px }
  .note { fill: var(--muted); font-size: 12px }
  .flow { fill: var(--fg); font-size: 12px }
  .edge { stroke: var(--line); stroke-width: 1.2; fill: none; marker-end: url(#to) }
  .both { marker-start: url(#from) }
  .head { fill: var(--line) }
</style>
<defs>
  <marker id="to" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path class="head" d="M0,0.5 L8,4 L0,7.5 Z"/></marker>
  <marker id="from" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path class="head" d="M8,0.5 L0,4 L8,7.5 Z"/></marker>
</defs>
<rect class="bg" width="980" height="740"/>
<rect class="node" x="250" y="40" width="140" height="42" rx="6"/>
<text class="name" x="320.0" y="61">Web UI</text>
<rect class="node" x="430" y="40" width="140" height="42" rx="6"/>
