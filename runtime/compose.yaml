# RDP/runtime, the web page, isolated code runner and the database. Configuration: .env (see .env.example).
name: computer-use

services:
  runtime:
    build: .
    image: computer-use:local
    init: true  # stops promptly: the entrypoint's shell is not PID 1
    restart: unless-stopped  # the container ends with its API, e.g. one that could not reach the database
    # Settings pass through from .env by name; an unset one keeps its default in config.py. Only what this container
    # decides is set here.
    environment:
      # The RDP launcher validates these; a deployment with another backend need not provide them.
      - RDP_HOST
      - RDP_USER
      - RDP_PASSWORD
      - RDP_DOMAIN
      # Runs, projects and memories go to the mongo service (files under data/ are for running outside compose).
      - CU_DATABASE_URL=mongodb://runtime:${MONGO_RUNTIME_PASSWORD}@mongo/computer_use?replicaSet=rs0
      - CU_AUTH=${CU_AUTH:-none}  # said outright: none is safe only while CU_BIND is 127.0.0.1
      - CU_AUTH_TOKEN
      - CU_AUTH_HEADER
      - CU_AUTH_PROXIES
      - CU_MAIN_MODEL
      - CU_MAIN_EFFORT
      - CU_COMPUTER_MODEL
      - CU_COMPUTER_EFFORT
      - CU_TITLE_MODEL
      - OPENAI_API_KEY
      - ANTHROPIC_API_KEY
      - LANGSMITH_TRACING
      - LANGSMITH_API_KEY
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-computer-use}
      - CU_DATA_DIR=/app/data
      - CU_TURN_URL=${CU_TURN_URL:-turn:localhost:3478?transport=tcp}  # as the browser sees it
      - CU_WEB_URL=${CU_WEB_URL:-http://localhost:8080}  # the web service's page, as the browser sees it
      - CU_CODE_RUNNER_URL=unix:///run/code-runner/runner.sock
    ports:
      - "127.0.0.1:8000:8000"  # HTTP API for the CLI and the web dev server
      - "127.0.0.1:8001:8001"  # the eval's server, for the version it tests (eval/README.md)
      - "${CU_BIND:-127.0.0.1}:3478:3478"  # TURN over TCP: the live view's WebRTC media
    volumes:
      - ./data:/app/data  # run logs and screenshots, readable from the Mac
      - code-runner:/run/code-runner  # the code runner's socket
      - rdp-certs:/root/.config/freerdp  # the Windows PC's certificate, trusted on first use, kept across rebuilds
    depends_on:
      mongo: {condition: service_healthy}

  # The web page, with /api passed on to the runtime.
  web:
    build: ../clients/web
    image: computer-use-web:local
    restart: unless-stopped
    ports:
      - "${CU_BIND:-127.0.0.1}:8080:80"
    depends_on: [runtime]

  # Isolated code runner: no network, runtime files or secrets.
  # The shared socket carries requests; working folders live in memory.
  code-runner:
    build: ../code-runner
    image: computer-use-code-runner:local
    init: true
    read_only: true
    tmpfs:
      - /workspace:size=512m,uid=1000,gid=1000,mode=0700
      - /tmp:size=64m,uid=1000,gid=1000,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1g
    cpus: 1
    network_mode: none
    environment:
      SOCKET: /run/code-runner/runner.sock
    volumes:
      - code-runner:/run/code-runner
    restart: unless-stopped

  # One-member replica set, reachable only inside this network; the runtime's user can use only its database. A replica
  # set, not a lone server: appends wait for the journal on a majority, and change streams need one.
  mongo:
    image: mongo:8.3.13  # the same tag as the CI job and runtime/README.md
    entrypoint: /mongo/entrypoint.sh
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      MONGO_RUNTIME_PASSWORD: ${MONGO_RUNTIME_PASSWORD:?Set MONGO_RUNTIME_PASSWORD in .env}
    volumes:
      - mongo:/data/db
      - ./mongo:/mongo:ro
      - ./mongo/init-runtime.js:/docker-entrypoint-initdb.d/init-runtime.js:ro
    healthcheck:
      # Initiates the set once; healthy when this member is primary. Signs in from the environment, so the password
      # stays off the command line.
      test: >-
        mongosh --quiet --eval
        'db.getSiblingDB("admin").auth("root", process.env.MONGO_INITDB_ROOT_PASSWORD);
        try { rs.status() } catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]}) }
        quit(db.hello().isWritablePrimary ? 0 : 1)'
      interval: 10s
      start_period: 60s
      start_interval: 1s
    restart: unless-stopped

volumes:
  mongo:  # database files
  rdp-certs:  # see the runtime's volumes
  # Holds only the code runner's socket: in memory, the runner's to write, and root's (the runtime's) to use.
  code-runner:
    driver_opts: {type: tmpfs, device: tmpfs, o: "uid=1000,gid=1000,mode=0700,size=1m"}
