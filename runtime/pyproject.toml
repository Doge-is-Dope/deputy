[project]
name = "computer-use"
version = "0.1.0"
description = "A computer use agent that operates a Windows desktop"
requires-python = ">=3.15"
dependencies = [
    "aiortc==1.15.0",
    "langchain==1.4.7",
    "langchain-anthropic==1.7.6",
    "langchain-openai==1.7.2",
    "pillow==13.0.0",
    "pydantic-settings==2.16.1",
    "python-xlib==0.33",
    "starlette==1.9.0",
    "uvicorn==0.54.0",
]

[project.scripts]
computer-use-runtime = "computer_use.serve:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not model'"
markers = ["model: calls a real model API (run with `pytest -m model`)"]
