[project]
name = "computer-use"
version = "0.1.0"
description = "A computer use agent that operates a Windows desktop"
requires-python = ">=3.15"
dependencies = [
    "aiortc==1.16.0",
    "langchain==1.5.2",
    "langchain-anthropic==1.7.12",
    "langchain-openai==1.8.5",
    "pillow==13.0.0",
    "pydantic-settings==2.16.3",
    "pymongo==4.20.1",
    "pypdfium2==5.15.2",
    "python-xlib==0.33",
    "pyyaml==6.0.3",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
]

[project.scripts]
computer-use-runtime = "computer_use.serve:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.6",
]

[tool.ruff.lint]
select = ["F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not model and not mongo'"
markers = [
    "model: calls a real model API (run with `pytest -m model`)",
    "mongo: runs a store's contract on MongoDB (run with `CU_TEST_MONGO_URL=... pytest -m mongo`)",
]
